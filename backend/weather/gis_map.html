<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KrishiRakshak - Farm Risk Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f5;
        }

        h2 {
            text-align: center;
            padding: 10px;
            margin-bottom: 0;
        }

        .search-box {
            text-align: center;
            padding: 15px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2e7d32;
            color: white;
        }

        button:hover {
            background: #1b5e20;
        }

        #map {
            height: 450px;
            width: 100%;
        }

        #information {
            padding: 20px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
        }

        .risk {
            font-size: 20px;
            font-weight: bold;
        }

        .loading {
            font-size: 18px;
            padding: 20px;
        }

        .error {
            color: #b71c1c;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <h2>🌾 KrishiRakshak Farm Risk Map</h2>


    <div class="search-box">

        <input
            type="text"
            id="locationInput"
            placeholder="Enter farm location"
            value="Bengaluru"
        >

        <button onclick="searchLocation()">
            🔍 Search
        </button>

    </div>


    <div id="map"></div>


    <div id="information">

        <div class="loading">
            Enter a location to get farm information.
        </div>

    </div>


    <!-- Leaflet JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // --------------------------------------------------
        // INITIAL MAP
        // --------------------------------------------------

        let latitude = 12.97194;
        let longitude = 77.59369;


        const map = L.map("map").setView(
            [latitude, longitude],
            12
        );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        let marker = L.marker(
            [latitude, longitude]
        ).addTo(map);


        // --------------------------------------------------
        // WEATHER RISK CALCULATION
        // --------------------------------------------------

        function calculateWeatherRisk(
            temperature,
            humidity,
            rainfall,
            rainProbability,
            windSpeed
        ) {

            const risks = [];


            // Heavy rainfall / flood risk

            if (
                rainfall >= 50 ||
                rainProbability >= 80
            ) {

                risks.push(
                    "Flood / Waterlogging"
                );

            }


            // Heat stress

            if (temperature >= 38) {

                risks.push(
                    "Heat Stress"
                );

            }


            // High humidity

            if (humidity >= 85) {

                risks.push(
                    "Fungal Disease Risk"
                );

            }


            // Strong wind

            if (windSpeed >= 40) {

                risks.push(
                    "Strong Wind"
                );

            }


            let overallRisk;


            if (risks.length >= 2) {

                overallRisk = "High";

            }

            else if (risks.length === 1) {

                overallRisk = "Medium";

            }

            else {

                overallRisk = "Low";

            }


            return {

                overall_risk: overallRisk,

                identified_risks: risks

            };

        }


        // --------------------------------------------------
        // SEARCH LOCATION
        // --------------------------------------------------

        async function searchLocation() {


            const location =
                document
                    .getElementById(
                        "locationInput"
                    )
                    .value
                    .trim();


            if (!location) {

                alert(
                    "Please enter a location."
                );

                return;

            }


            document.getElementById(
                "information"
            ).innerHTML = `

                <div class="loading">

                    ⏳ Loading weather,
                    satellite and farm risk data...

                </div>

            `;


            try {


                // --------------------------------------------------
                // 1. WEATHER API
                // --------------------------------------------------

                const weatherResponse =
                    await fetch(

                        "http://127.0.0.1:8000/weather?location="
                        +
                        encodeURIComponent(
                            location
                        )

                    );


                if (!weatherResponse.ok) {

                    throw new Error(
                        "Weather API request failed."
                    );

                }


                const weatherData =
                    await weatherResponse.json();


                if (weatherData.error) {

                    document.getElementById(
                        "information"
                    ).innerHTML = `

                        <div class="error">

                            ❌ ${weatherData.error}

                        </div>

                    `;

                    return;

                }


                // --------------------------------------------------
                // LOCATION
                // --------------------------------------------------

                const locationData =
                    weatherData.location;


                latitude =
                    Number(
                        locationData.latitude
                    );


                longitude =
                    Number(
                        locationData.longitude
                    );


                map.setView(
                    [latitude, longitude],
                    12
                );


                marker.setLatLng(
                    [latitude, longitude]
                );


                marker.bindPopup(

                    "<b>🌾 Farm Location</b><br>" +

                    locationData.name +

                    ", " +

                    locationData.country +

                    "<br><br>Latitude: " +

                    latitude +

                    "<br>Longitude: " +

                    longitude

                );


                // --------------------------------------------------
                // CURRENT WEATHER
                // --------------------------------------------------

                const current =
                    weatherData
                        .weather
                        .current;


                // --------------------------------------------------
                // WEATHER FORECAST
                // --------------------------------------------------

                const daily =
                    weatherData
                        .weather
                        .daily;


                let rainProbability = 0;


                if (
                    daily &&
                    daily.precipitation_probability_max
                ) {

                    rainProbability =
                        Math.max(
                            ...daily
                                .precipitation_probability_max
                        );

                }


                // --------------------------------------------------
                // WEATHER VALUES
                // --------------------------------------------------

                const temperature =
                    Number(
                        current.temperature_2m
                    );


                const humidity =
                    Number(
                        current.relative_humidity_2m
                    );


                const rainfall =
                    Number(
                        current.precipitation
                    );


                const windSpeed =
                    Number(
                        current.wind_speed_10m
                    );


                // --------------------------------------------------
                // WEATHER RISK
                // --------------------------------------------------

                const weatherRisk =
                    calculateWeatherRisk(

                        temperature,

                        humidity,

                        rainfall,

                        rainProbability,

                        windSpeed

                    );


                // --------------------------------------------------
                // 2. NDVI API
                // --------------------------------------------------

                let ndviData = null;


                try {


                    const ndviResponse =
                        await fetch(

                            "http://127.0.0.1:8001/ndvi"

                            +
                            "?latitude="

                            +
                            encodeURIComponent(
                                latitude
                            )

                            +
                            "&longitude="

                            +
                            encodeURIComponent(
                                longitude
                            )

                        );


                    if (
                        ndviResponse.ok
                    ) {

                        ndviData =
                            await ndviResponse.json();

                    }


                }

                catch (ndviError) {

                    console.error(
                        "NDVI API error:",
                        ndviError
                    );

                }


                // --------------------------------------------------
                // NDVI HTML
                // --------------------------------------------------

                let ndviHTML = "";


                if (
                    ndviData &&
                    ndviData.success
                ) {


                    const ndvi =
                        ndviData.ndvi;


                    ndviHTML = `

                        <div class="card">

                            <h3>
                                🛰️ Satellite Analysis
                            </h3>


                            <p>

                                🌱 Mean NDVI:

                                <span class="value">

                                    ${ndvi.mean}

                                </span>

                            </p>


                            <p>

                                📉 Minimum NDVI:

                                <span class="value">

                                    ${ndvi.minimum}

                                </span>

                            </p>


                            <p>

                                📈 Maximum NDVI:

                                <span class="value">

                                    ${ndvi.maximum}

                                </span>

                            </p>


                            <p>

                                ❤️ Vegetation Health:

                                <span class="value">

                                    ${ndvi.health_score}/100

                                </span>

                            </p>


                            <p>

                                ⚠️ NDVI Risk:

                                <span class="risk">

                                    ${ndvi.risk_level}

                                </span>

                            </p>


                            <p>

                                🌾 Condition:

                                <b>

                                    ${ndviData
                                        .vegetation_condition}

                                </b>

                            </p>

                        </div>

                    `;


                }

                else {


                    ndviHTML = `

                        <div class="card">

                            <h3>
                                🛰️ Satellite Analysis
                            </h3>

                            <p>

                                ❌ Satellite data
                                unavailable.

                            </p>

                        </div>

                    `;

                }


                // --------------------------------------------------
                // 3. COMBINED FARM RISK API
                // --------------------------------------------------

                let farmRiskData = null;


                if (
                    ndviData &&
                    ndviData.success
                ) {


                    try {


                        const ndviRisk =
                            ndviData
                                .ndvi
                                .risk_level;


                        const farmRiskResponse =
                            await fetch(

                                "http://127.0.0.1:8002/farm-risk"

                                +

                                "?weather_risk="

                                +

                                encodeURIComponent(
                                    weatherRisk
                                        .overall_risk
                                )

                                +

                                "&ndvi_risk="

                                +

                                encodeURIComponent(
                                    ndviRisk
                                )

                            );


                        if (
                            farmRiskResponse.ok
                        ) {

                            farmRiskData =
                                await farmRiskResponse.json();

                        }


                    }

                    catch (farmRiskError) {

                        console.error(
                            "Farm Risk API error:",
                            farmRiskError
                        );

                    }

                }


                // --------------------------------------------------
                // FARM RISK HTML
                // --------------------------------------------------

                let farmRiskHTML = "";


                if (
                    farmRiskData &&
                    farmRiskData.success
                ) {


                    const risk =
                        farmRiskData
                            .farm_risk;


                    farmRiskHTML = `

                        <div class="card">

                            <h3>
                                🌾 Overall Farm Risk
                            </h3>


                            <p>

                                🌦️ Weather Risk:

                                <span class="value">

                                    ${risk.weather_risk}

                                </span>

                            </p>


                            <p>

                                🛰️ NDVI Risk:

                                <span class="value">

                                    ${risk.ndvi_risk}

                                </span>

                            </p>


                            <p>

                                📊 Farm Risk Score:

                                <span class="value">

                                    ${risk.overall_score}/100

                                </span>

                            </p>


                            <p>

                                🚨 Overall Risk:

                                <span class="risk">

                                    ${risk.overall_risk}

                                </span>

                            </p>

                        </div>

                    `;


                }

                else {


                    farmRiskHTML = `

                        <div class="card">

                            <h3>
                                🌾 Overall Farm Risk
                            </h3>

                            <p>

                                ❌ Combined risk
                                unavailable.

                            </p>

                        </div>

                    `;

                }


                // --------------------------------------------------
                // DISPLAY EVERYTHING
                // --------------------------------------------------

                document.getElementById(
                    "information"
                ).innerHTML = `


                    <h3>

                        📍 ${locationData.name},

                        ${locationData.country}

                    </h3>


                    <div class="cards">


                        <!-- WEATHER -->

                        <div class="card">

                            <h3>
                                🌦️ Weather Information
                            </h3>


                            <p>

                                🌡️ Temperature:

                                <span class="value">

                                    ${temperature} °C

                                </span>

                            </p>


                            <p>

                                💧 Humidity:

                                <span class="value">

                                    ${humidity} %

                                </span>

                            </p>


                            <p>

                                🌧️ Rainfall:

                                <span class="value">

                                    ${rainfall} mm

                                </span>

                            </p>


                            <p>

                                🌧️ Rain Probability:

                                <span class="value">

                                    ${rainProbability} %

                                </span>

                            </p>


                            <p>

                                💨 Wind Speed:

                                <span class="value">

                                    ${windSpeed} km/h

                                </span>

                            </p>


                            <p>

                                ⚠️ Weather Risk:

                                <span class="risk">

                                    ${weatherRisk
                                        .overall_risk}

                                </span>

                            </p>


                        </div>


                        ${ndviHTML}


                        ${farmRiskHTML}


                    </div>

                `;


            }


            catch (error) {


                console.error(
                    "Application error:",
                    error
                );


                document.getElementById(
                    "information"
                ).innerHTML = `

                    <div class="error">

                        ❌ Could not connect
                        to the required APIs.

                        <br><br>

                        Make sure the Weather,
                        NDVI and Farm Risk APIs
                        are running.

                    </div>

                `;

            }

        }


        // --------------------------------------------------
        // LOAD DEFAULT LOCATION
        // --------------------------------------------------

        searchLocation();

    </script>

</body>

</html>
