<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KrishiRakshak - Farm Risk Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f5;
        }

        h2 {
            text-align: center;
            padding: 10px;
            margin-bottom: 0;
        }

        .search-box {
            text-align: center;
            padding: 15px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #map {
            height: 450px;
            width: 100%;
        }

        #information {
            padding: 20px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
        }

        .risk {
            font-size: 20px;
            font-weight: bold;
        }

        .loading {
            font-size: 18px;
            padding: 20px;
        }

    </style>
</head>

<body>

    <h2>🌾 KrishiRakshak Farm Risk Map</h2>

    <!-- Search -->
    <div class="search-box">

        <input
            type="text"
            id="locationInput"
            placeholder="Enter farm location"
            value="Bengaluru"
        >

        <button onclick="searchLocation()">
            🔍 Search
        </button>

    </div>


    <!-- Map -->
    <div id="map"></div>


    <!-- Information -->
    <div id="information">

        <div class="loading">
            Enter a location to get farm information.
        </div>

    </div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // ------------------------------------------------
        // DEFAULT LOCATION
        // ------------------------------------------------

        let latitude = 12.97194;
        let longitude = 77.59369;


        // ------------------------------------------------
        // CREATE MAP
        // ------------------------------------------------

        const map = L.map("map").setView(
            [latitude, longitude],
            12
        );


        // OpenStreetMap
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // Marker
        let marker = L.marker(
            [latitude, longitude]
        ).addTo(map);


        // ------------------------------------------------
        // SEARCH LOCATION
        // ------------------------------------------------

        async function searchLocation() {

            const location =
                document.getElementById(
                    "locationInput"
                ).value.trim();


            if (!location) {

                alert(
                    "Please enter a location."
                );

                return;
            }


            // Show loading message
            document.getElementById(
                "information"
            ).innerHTML = `

                <div class="loading">
                    ⏳ Loading weather and satellite data...
                </div>

            `;


            try {

                // ------------------------------------------------
                // WEATHER API
                // ------------------------------------------------

                const weatherResponse =
                    await fetch(
                        "http://127.0.0.1:8000/weather?location="
                        + encodeURIComponent(location)
                    );


                const weatherData =
                    await weatherResponse.json();


                // Check weather error
                if (weatherData.error) {

                    document.getElementById(
                        "information"
                    ).innerHTML =
                        "❌ " + weatherData.error;

                    return;
                }


                // ------------------------------------------------
                // GET LOCATION COORDINATES
                // ------------------------------------------------

                const locationData =
                    weatherData.location;


                latitude =
                    locationData.latitude;

                longitude =
                    locationData.longitude;


                // ------------------------------------------------
                // UPDATE MAP
                // ------------------------------------------------

                map.setView(
                    [latitude, longitude],
                    12
                );


                marker.setLatLng(
                    [latitude, longitude]
                );


                marker.bindPopup(

                    "<b>🌾 Farm Location</b><br>" +

                    locationData.name +
                    ", " +
                    locationData.country +

                    "<br><br>Latitude: " +
                    latitude +

                    "<br>Longitude: " +
                    longitude

                ).openPopup();


                // ------------------------------------------------
                // WEATHER DATA
                // ------------------------------------------------

                const current =
                    weatherData.weather.current;


                // ------------------------------------------------
                // SATELLITE NDVI API
                // ------------------------------------------------

                let ndviData = null;


                try {

                    const ndviResponse =
                        await fetch(

                            "http://127.0.0.1:8001/ndvi"
                            + "?latitude="
                            + latitude
                            + "&longitude="
                            + longitude

                        );


                    ndviData =
                        await ndviResponse.json();


                }

                catch (ndviError) {

                    console.error(
                        "NDVI API error:",
                        ndviError
                    );

                }


                // ------------------------------------------------
                // NDVI INFORMATION
                // ------------------------------------------------

                let ndviHTML = "";


                if (
                    ndviData &&
                    ndviData.success
                ) {

                    const ndvi =
                        ndviData.ndvi;


                    ndviHTML = `

                        <div class="card">

                            <h3>
                                🛰️ Satellite Analysis
                            </h3>

                            <p>
                                🌱 Mean NDVI:
                                <span class="value">
                                    ${ndvi.mean}
                                </span>
                            </p>

                            <p>
                                📉 Minimum NDVI:
                                <span class="value">
                                    ${ndvi.minimum}
                                </span>
                            </p>

                            <p>
                                📈 Maximum NDVI:
                                <span class="value">
                                    ${ndvi.maximum}
                                </span>
                            </p>

                            <p>
                                ❤️ Vegetation Health:
                                <span class="value">
                                    ${ndvi.health_score}/100
                                </span>
                            </p>

                            <p>
                                ⚠️ Risk Level:
                                <span class="risk">
                                    ${ndvi.risk_level}
                                </span>
                            </p>

                            <p>
                                🌾 Condition:
                                <b>
                                    ${ndviData.vegetation_condition}
                                </b>
                            </p>

                        </div>

                    `;

                }

                else {

                    ndviHTML = `

                        <div class="card">

                            <h3>
                                🛰️ Satellite Analysis
                            </h3>

                            <p>
                                ❌ Satellite data
                                unavailable.
                            </p>

                        </div>

                    `;

                }


                // ------------------------------------------------
                // DISPLAY WEATHER + SATELLITE
                // ------------------------------------------------

                document.getElementById(
                    "information"
                ).innerHTML = `

                    <h3>
                        📍 ${locationData.name},
                        ${locationData.country}
                    </h3>

                    <div class="cards">

                        <!-- WEATHER CARD -->

                        <div class="card">

                            <h3>
                                🌦️ Weather Information
                            </h3>

                            <p>
                                🌡️ Temperature:
                                <span class="value">
                                    ${current.temperature_2m} °C
                                </span>
                            </p>

                            <p>
                                💧 Humidity:
                                <span class="value">
                                    ${current.relative_humidity_2m} %
                                </span>
                            </p>

                            <p>
                                🌧️ Rainfall:
                                <span class="value">
                                    ${current.precipitation} mm
                                </span>
                            </p>

                            <p>
                                💨 Wind Speed:
                                <span class="value">
                                    ${current.wind_speed_10m} km/h
                                </span>
                            </p>

                        </div>


                        <!-- SATELLITE CARD -->

                        ${ndviHTML}

                    </div>

                `;

            }


            catch (error) {

                document.getElementById(
                    "information"
                ).innerHTML = `

                    ❌ Could not connect
                    to the APIs.

                `;

                console.error(error);

            }

        }


        // ------------------------------------------------
        // LOAD DEFAULT LOCATION
        // ------------------------------------------------

        searchLocation();

    </script>

</body>

</html>
